name: AstroSkyFinder
options:
  bundleIdPrefix: com.personal.astro
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTS_MACCATALYST: NO
    ENABLE_BITCODE: NO

targets:
  AstroSkyFinder:
    type: application
    platform: iOS
    sources:
      - path: AstroSkyFinder
    info:
      path: AstroSkyFinder/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.astro.AstroSkyFinder
        PRODUCT_NAME: AstroSkyFinder
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreMotion.framework
      - sdk: CoreLocation.framework
      - sdk: CoreImage.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: Accelerate.framework
      - sdk: Photos.framework
    scheme:
      testTargets:
        - AstroSkyFinderTests
        - AstroSkyFinderUITests

  AstroSkyFinderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AstroSkyFinderTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - target: AstroSkyFinder

  AstroSkyFinderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AstroSkyFinderUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - target: AstroSkyFinder
